<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoinSafe — Your AI money assistant on Telegram</title>
  <meta name="description" content="Set a monthly budget, text your expenses to CoinSafe on Telegram, and get a daily summary of how much of your budget you've used.">
  <meta name="theme-color" content="#15803d">
  <meta name="color-scheme" content="light dark">

  <!-- Preview shown when the link is shared on social media / chat apps -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CoinSafe — Control your spending just by chatting">
  <meta property="og:description" content="An AI money assistant that lives in your messaging app. Now on Telegram.">

  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

  <!-- Adds the "js" class right away, so CSS knows JavaScript is available
       (used to hide elements that will be animated in on scroll). -->
  <script>document.documentElement.classList.add('js');</script>
  <!-- "defer" = download now, but only run after the HTML has been read -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Lets keyboard users jump straight past the menu -->
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- HEADER -->

  <main id="main">

  </main>

  <!-- FOOTER -->
</body>
</html>
